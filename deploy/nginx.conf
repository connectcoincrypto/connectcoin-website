# Existing VPS 3 virtual hosts. Install in place of connectcoin-whitepaper;
# do not enable both configurations, as their listen/server_name values overlap.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name connectcoincrypto.com connectcoin2.com 82.25.65.36 _;
    server_tokens off;

    # Preserve unattended HTTP-01 domain and IP certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://connectcoincrypto.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name connectcoincrypto.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/connectcoincrypto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectcoincrypto.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ConnectCoinTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/connectcoin-website/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location = /whitepaper.pdf {
        try_files $uri =404;
        types { application/pdf pdf; }
        default_type application/pdf;
        add_header Content-Disposition 'inline; filename="connectcoin-whitepaper.pdf"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name connectcoin2.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/connectcoincrypto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectcoincrypto.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ConnectCoinTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    return 301 https://connectcoincrypto.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 82.25.65.36;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/connectcoin-vps3-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectcoin-vps3-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ConnectCoinTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    return 301 https://connectcoincrypto.com$request_uri;
}
